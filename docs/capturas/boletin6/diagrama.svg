<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f42c1"/></marker>
    <marker id="grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="gry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1240" height="1010" fill="#ffffff"/>

  <!-- ================= GitHub ================= -->
  <rect x="20" y="20" width="1200" height="250" rx="14" fill="#f5f0ff" stroke="#6f42c1" stroke-width="2"/>
  <text x="36" y="44" font-size="16" font-weight="bold" fill="#6f42c1">GitHub (la nube)</text>

  <rect x="40" y="70" width="230" height="180" rx="8" fill="#fff" stroke="#8c959f"/>
  <text x="52" y="92" font-weight="bold">Repositorio</text>
  <text x="52" y="112">samuelavilesc/</text>
  <text x="52" y="128">practicas-continuas-gloriasamu</text>
  <text x="52" y="152">main + etiquetas vX.Y.Z</text>
  <text x="52" y="176">deploy/: playbook, inventario,</text>
  <text x="52" y="192">vault.yml cifrado</text>
  <text x="52" y="216">.github/workflows/release.yml</text>

  <rect x="300" y="70" width="330" height="180" rx="8" fill="#fff" stroke="#8c959f"/>
  <text x="312" y="92" font-weight="bold">GitHub Actions: workflow Release</text>
  <rect x="315" y="102" width="300" height="56" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="325" y="122" font-weight="bold">job publish</text>
  <text x="325" y="140">runner de GitHub (ubuntu-latest)</text>
  <text x="325" y="154" fill="#57606a">metadata-action + build-push-action</text>
  <rect x="315" y="170" width="300" height="66" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="325" y="190" font-weight="bold">job deploy</text>
  <text x="325" y="207">needs: publish · solo con tags v*</text>
  <text x="325" y="224">runs-on: self-hosted · environment: produccion</text>

  <rect x="660" y="70" width="260" height="180" rx="8" fill="#fff" stroke="#8c959f"/>
  <text x="672" y="92" font-weight="bold">Entorno produccion</text>
  <text x="672" y="114">Required reviewers:</text>
  <text x="672" y="130">Samuel y Gloria</text>
  <rect x="672" y="142" width="236" height="26" rx="5" fill="#ffebe9" stroke="#cf222e"/>
  <text x="682" y="160">secret VAULT_PASS</text>
  <text x="672" y="194" fill="#9a6700">④ deploy espera; un reviewer</text>
  <text x="672" y="210" fill="#9a6700">lo aprueba desde el navegador</text>
  <text x="672" y="226" fill="#9a6700">(HTTPS)</text>

  <rect x="950" y="70" width="250" height="180" rx="8" fill="#fff" stroke="#8c959f"/>
  <text x="962" y="92" font-weight="bold">GHCR (ghcr.io)</text>
  <text x="962" y="112">registro de imágenes</text>
  <text x="962" y="136">samuelavilesc/</text>
  <text x="962" y="152">practicas-continuas-gloriasamu</text>
  <text x="962" y="176">tags: 1.0.0 · 1.1.0 · 1.2.0</text>
  <text x="962" y="192">sha-xxxxxxx · latest</text>

  <!-- ② repo -> publish -->
  <line x1="270" y1="130" x2="313" y2="130" stroke="#57606a" stroke-width="2" marker-end="url(#gry)"/>
  <text x="274" y="122" fill="#57606a" font-weight="bold">②</text>
  <!-- ③ publish -> GHCR -->
  <path d="M615,115 L640,115 L640,58 L935,58 L935,112 L948,112" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#pur)"/>
  <text x="660" y="53" fill="#6f42c1">③ docker push de la imagen X.Y.Z (HTTPS)</text>
  <!-- ④ deploy -> environment -->
  <line x1="615" y1="200" x2="658" y2="200" stroke="#9a6700" stroke-width="2" marker-end="url(#gry)"/>

  <!-- ================= Anfitrión ================= -->
  <rect x="20" y="330" width="1200" height="660" rx="14" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>

  <!-- WSL -->
  <rect x="40" y="372" width="400" height="600" rx="10" fill="#fff" stroke="#57606a" stroke-dasharray="6 4"/>

  <rect x="60" y="410" width="360" height="62" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="72" y="432" font-weight="bold">Terminal del desarrollador</text>
  <text x="72" y="452">git tag -a v1.2.0 · git push origin v1.2.0</text>

  <rect x="60" y="510" width="360" height="110" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="72" y="532" font-weight="bold">Runner autoalojado (~/actions-runner/run.sh)</text>
  <text x="72" y="552">ss4muu-desktop · etiquetas self-hosted, Linux, X64</text>
  <text x="72" y="572">_work/: checkout del repositorio</text>
  <text x="72" y="592">VAULT_PASS → fichero temporal (mktemp, borrado</text>
  <text x="72" y="608">con trap al terminar)</text>

  <rect x="60" y="660" width="360" height="130" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="72" y="682" font-weight="bold">Ansible 2.16.3 (controlador)</text>
  <text x="72" y="702">ansible-playbook -i deploy/inventory.ini</text>
  <text x="72" y="718">  deploy/deploy.yml --extra-vars version_app=1.2.0</text>
  <text x="72" y="740">descifra vault.yml con VAULT_PASS</text>
  <text x="72" y="760">community.docker 3.7.0 · sshpass</text>
  <text x="72" y="778" fill="#57606a">play 1: Docker en todos · 2: db · 3: app</text>

  <rect x="60" y="890" width="360" height="62" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="72" y="912" font-weight="bold">Comprobación</text>
  <text x="72" y="932">curl localhost:8081 · curl localhost:8082</text>

  <!-- ① push -->
  <line x1="150" y1="410" x2="150" y2="252" stroke="#6f42c1" stroke-width="2" marker-end="url(#pur)"/>
  <text x="158" y="300" fill="#6f42c1">① git push vX.Y.Z</text>
  <text x="158" y="316" fill="#6f42c1">(HTTPS, lo inicia el desarrollador)</text>
  <!-- ⑤ runner -> deploy (long polling) -->
  <path d="M380,510 L380,286 L465,286 L465,238" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#pur)"/>
  <text x="474" y="284" fill="#6f42c1">⑤ el runner sondea GitHub y recibe el job y VAULT_PASS</text>
  <text x="474" y="299" fill="#6f42c1">(HTTPS saliente: lo inicia el runner, no GitHub)</text>
  <!-- ⑥ runner -> ansible -->
  <line x1="240" y1="620" x2="240" y2="658" stroke="#57606a" stroke-width="2" marker-end="url(#gry)"/>
  <text x="248" y="645" fill="#57606a">⑥ checkout + ansible-playbook</text>

  <!-- Docker Desktop -->
  <rect x="470" y="372" width="730" height="600" rx="10" fill="#fff" stroke="#0969da" stroke-dasharray="6 4"/>

  <!-- app1 -->
  <rect x="490" y="425" width="220" height="290" rx="8" fill="#f6f8fa" stroke="#24292f"/>
  <text x="502" y="446" font-weight="bold">Contenedor app1 (privileged)</text>
  <text x="502" y="462" fill="#57606a">rastasheep/ubuntu-sshd:18.04</text>
  <text x="502" y="480" fill="#0969da">sshd :22 ← 2223 · :8080 ← 8081</text>
  <rect x="502" y="492" width="196" height="210" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="512" y="512" font-weight="bold">dockerd (Docker-in-Docker)</text>
  <rect x="512" y="522" width="176" height="96" rx="5" fill="#fff" stroke="#0969da"/>
  <text x="520" y="540" font-weight="bold">tareas-api</text>
  <text x="520" y="556">ghcr.io/…:1.2.0</text>
  <text x="520" y="572">network_mode: host</text>
  <text x="520" y="588">Spring Boot :8080</text>
  <text x="520" y="606" fill="#57606a">restart_policy: always</text>
  <text x="512" y="640" fill="#9a6700">⑨ docker pull · docker run</text>
  <text x="512" y="660" fill="#9a6700">⑪ smoke test</text>
  <text x="512" y="676" fill="#9a6700">GET /actuator/health → UP</text>

  <!-- app2 -->
  <rect x="730" y="425" width="220" height="290" rx="8" fill="#f6f8fa" stroke="#24292f"/>
  <text x="742" y="446" font-weight="bold">Contenedor app2 (privileged)</text>
  <text x="742" y="462" fill="#57606a">rastasheep/ubuntu-sshd:18.04</text>
  <text x="742" y="480" fill="#0969da">sshd :22 ← 2224 · :8080 ← 8082</text>
  <rect x="742" y="492" width="196" height="210" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="752" y="512" font-weight="bold">dockerd (Docker-in-Docker)</text>
  <rect x="752" y="522" width="176" height="96" rx="5" fill="#fff" stroke="#0969da"/>
  <text x="760" y="540" font-weight="bold">tareas-api</text>
  <text x="760" y="556">ghcr.io/…:1.2.0</text>
  <text x="760" y="572">network_mode: host</text>
  <text x="760" y="588">Spring Boot :8080</text>
  <text x="760" y="606" fill="#57606a">restart_policy: always</text>
  <text x="752" y="640" fill="#9a6700">⑨ docker pull · docker run</text>
  <text x="752" y="660" fill="#9a6700">⑪ smoke test</text>
  <text x="752" y="676" fill="#9a6700">GET /actuator/health → UP</text>

  <!-- db1 -->
  <rect x="970" y="425" width="210" height="290" rx="8" fill="#f6f8fa" stroke="#24292f"/>
  <text x="982" y="446" font-weight="bold">Contenedor db1 (privileged)</text>
  <text x="982" y="462" fill="#57606a">rastasheep/ubuntu-sshd:18.04</text>
  <text x="982" y="480" fill="#0969da">sshd :22 ← 2225 (5432 no se publica)</text>
  <rect x="982" y="492" width="186" height="210" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="992" y="512" font-weight="bold">dockerd (Docker-in-Docker)</text>
  <rect x="992" y="522" width="166" height="96" rx="5" fill="#fff" stroke="#0969da"/>
  <text x="1000" y="540" font-weight="bold">tareas-db</text>
  <text x="1000" y="556">postgres:16</text>
  <text x="1000" y="572">network_mode: host</text>
  <text x="1000" y="588">PostgreSQL :5432</text>
  <text x="1000" y="606" fill="#57606a">volumen tareas-db-data</text>
  <text x="992" y="640" fill="#9a6700">⑧ docker_container</text>
  <text x="992" y="656" fill="#9a6700">(sin cambios si ya corre)</text>

  <!-- ⑨ pull desde GHCR -->
  <path d="M600,425 L600,312 L1150,312 L1150,252" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#pur)"/>
  <line x1="840" y1="425" x2="840" y2="312" stroke="#6f42c1" stroke-width="2"/>

  <!-- ⑩ JDBC: de cada tareas-api a tareas-db -->
  <path d="M670,618 L670,748 L1140,748 L1140,620" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#blu)"/>
  <line x1="910" y1="618" x2="910" y2="748" stroke="#0969da" stroke-width="2"/>

  <!-- ⑦ SSH desde Ansible -->
  <path d="M420,775 L1060,775" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <line x1="610" y1="775" x2="610" y2="717" stroke="#1a7f37" stroke-width="2" marker-end="url(#grn)"/>
  <line x1="850" y1="775" x2="850" y2="717" stroke="#1a7f37" stroke-width="2" marker-end="url(#grn)"/>
  <line x1="1060" y1="775" x2="1060" y2="717" stroke="#1a7f37" stroke-width="2" marker-end="url(#grn)"/>

  <!-- ⑫ curl -->
  <path d="M420,920 L790,920 L790,717" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#blu)"/>
  <line x1="550" y1="920" x2="550" y2="717" stroke="#0969da" stroke-width="2" marker-end="url(#blu)"/>

  <!-- Leyenda -->
  <rect x="820" y="840" width="370" height="112" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text x="832" y="860" font-weight="bold">Leyenda (la flecha sale de quien inicia la conexión)</text>
  <line x1="832" y1="878" x2="872" y2="878" stroke="#6f42c1" stroke-width="2"/><text x="880" y="882">HTTPS hacia GitHub / GHCR</text>
  <line x1="832" y1="898" x2="872" y2="898" stroke="#1a7f37" stroke-width="2"/><text x="880" y="902">SSH (Ansible → flota)</text>
  <line x1="832" y1="918" x2="872" y2="918" stroke="#0969da" stroke-width="2"/><text x="880" y="922">HTTP / TCP local</text>
  <line x1="832" y1="938" x2="872" y2="938" stroke="#57606a" stroke-width="2"/><text x="880" y="942">dentro de la misma máquina o servicio</text>
  <!-- etiquetas con halo, encima de las líneas -->
  <text stroke="#f6f8fa" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="36" y="356" font-size="16" font-weight="bold">Tu ordenador (anfitrión físico, Windows 11)</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="54" y="394" font-weight="bold">WSL2 · Ubuntu 24.04</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="484" y="394" font-weight="bold" fill="#0969da">Docker Desktop (motor Docker del anfitrión)</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="484" y="410" fill="#57606a">deploy/servidores/docker-compose.yml · red de Compose: app1, app2 y db1 se resuelven por nombre</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="684" y="766" fill="#0969da" font-size="11">⑩ JDBC db1:5432 (TCP, lo inicia la API)</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="484" y="795" fill="#1a7f37">⑦ SSH a localhost:2223 / 2224 / 2225 (lo inicia Ansible; root + sshpass)</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="484" y="811" fill="#1a7f37">play 1: instala docker.io y arranca dockerd · play 2: db1 · play 3: app1 y app2</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="484" y="940" fill="#0969da">⑫ HTTP :8081 → app1:8080 · :8082 → app2:8080</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="862" y="328" fill="#6f42c1">⑨ docker login + pull 1.2.0 (HTTPS,</text>
  <text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="862" y="343" fill="#6f42c1">lo inicia el dockerd de app1/app2)</text>
</svg>
