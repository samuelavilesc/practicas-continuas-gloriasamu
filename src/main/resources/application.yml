spring:
  application:
    name: todo-api
  # Valores por defecto para ejecutar fuera de Docker; en Compose se
  # sobrescriben con SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/tareas
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
