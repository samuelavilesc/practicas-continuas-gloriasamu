name: CI

on:
  # push a cualquier rama (no solo a main), para tener feedback antes de abrir el PR
  push:
    branches: [ "**" ]
    paths-ignore: [ "README.md" ]   # un cambio solo en el README no necesita CI
  # en los PR no se filtra: los checks lint, test y package son obligatorios en main
  # y, si el CI no se ejecutara, un PR que solo cambia el README no se podría fusionar
  pull_request:
  # permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# este workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Comprobar formato
        run: mvn -B spotless:check      # el Spotless del Boletín 1

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # el informe de tests crea un check run, y eso requiere escribir checks
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Tests
        run: mvn -B verify
      - name: Publicar informe de tests
        if: always()                    # también (sobre todo) cuando fallan los tests
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          # por defecto deja el informe solo en el resumen del job; así crea el check run
          use-actions-summary: "false"

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B package -DskipTests
      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
