name: Pages

# En cada push a main genera la web de la documentación (docs/site/) y la publica en GitHub Pages.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # publicar en Pages
  id-token: write    # el despliegue en Pages se autentica con OIDC

# un solo despliegue a la vez; no se cancela uno en curso para no dejar la web a medias
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Instalar dependencias del generador
        run: npm ci
        working-directory: docs
      - name: Generar la web
        run: node build-site.js
        working-directory: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
